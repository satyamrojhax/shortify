name: Publish to npm

on:
  release:
    types: [created]
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: shortify-npm-package
    permissions:
      contents: read
      id-token: write # Required for npm provenance / Trusted Publishers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish package
        run: npm publish --provenance --access public
